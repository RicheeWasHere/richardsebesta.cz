<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR algoritmus</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
  }
  body {
    color: #f4f4f5;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
    user-select: none;
  }
  .stage {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
    transform-origin: center center;
  }
  .block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .label {
    font-size: 12px;
    color: #71717a;
    letter-spacing: 0.02em;
  }
  .label sub { font-size: 10px; }
  .matrix {
    border-left: 2px solid #71717a;
    border-right: 2px solid #71717a;
    padding: 8px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 16px;
    height: 32px;
  }
  .cell {
    position: relative;
    width: 52px;
    height: 32px;
    overflow: hidden;
  }
  .num {
    position: absolute;
    right: 0;
    top: 0;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    transition: color 0.4s ease;
  }
  .tone-white { color: #f4f4f5; }
  .tone-dim { color: #a1a1aa; }
  .tone-muted { color: #52525b; }
  .tone-red { color: #ef4444; }
  .tone-green { color: #4ade80; }
  .flow {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    min-width: 9.5rem;
    color: #71717a;
    font-size: 12px;
  }
  .line {
    color: #71717a;
    transition: color 0.35s ease;
    white-space: nowrap;
  }
  .line.active { color: #f4f4f5; }
  .arrow {
    color: #52525b;
    font-size: 12px;
    line-height: 1;
    padding-left: 2.1rem;
  }
  @media (max-width: 520px) {
    .stage {
      flex-direction: column;
      gap: 16px;
    }
    .flow {
      align-items: center;
      min-width: 0;
    }
    .arrow { padding-left: 0; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="block">
    <div class="label">A<sub id="kSub">0</sub></div>
    <div class="matrix" id="matrix"></div>
  </div>
  <div class="flow">
    <div class="line" id="pQR">A<sub>k</sub> = Q<sub>k</sub> R<sub>k</sub></div>
    <div class="arrow">↓</div>
    <div class="line" id="pRQ">A<sub>k+1</sub> = R<sub>k</sub> Q<sub>k</sub></div>
  </div>
</div>

<script>
const N = 4;
const MAX_STEPS = 10;
const ROLL_MS = 500;
const ROLL_Y = 15;
const ROLL_EASE = "cubic-bezier(0.175, 0.885, 0.32, 1.275)";
let A = [];
let k = 0;
const cells = [];

function randSign() {
  return Math.random() < 0.5 ? -1 : 1;
}

function randRange(min, max) {
  return min + Math.random() * (max - min);
}

// Gram-Schmidtův QR rozklad
function qrDecompose(M) {
  const Q = Array.from({ length: N }, () => Array(N).fill(0));
  const R = Array.from({ length: N }, () => Array(N).fill(0));

  for (let j = 0; j < N; j++) {
    let v = M.map(row => row[j]);
    for (let i = 0; i < j; i++) {
      let dot = 0;
      for (let r = 0; r < N; r++) dot += Q[r][i] * M[r][j];
      R[i][j] = dot;
      for (let r = 0; r < N; r++) v[r] -= dot * Q[r][i];
    }
    let norm = Math.sqrt(v.reduce((acc, x) => acc + x * x, 0));
    if (norm < 1e-12) norm = 1e-12;
    R[j][j] = norm;
    for (let r = 0; r < N; r++) Q[r][j] = v[r] / norm;
  }
  return { Q, R };
}

function matMul(X, Y) {
  const res = Array.from({ length: N }, () => Array(N).fill(0));
  for (let i = 0; i < N; i++) {
    for (let j = 0; j < N; j++) {
      let sum = 0;
      for (let m = 0; m < N; m++) sum += X[i][m] * Y[m][j];
      res[i][j] = sum;
    }
  }
  return res;
}

function transpose(M) {
  return M[0].map((_, c) => M.map(r => r[c]));
}

// Vygeneruje náhodnou symetrickou matici A_0 = Q * D * Q^T s dobře odděleným spektrem
function generateFastConvergingMatrix() {
  const eigs = [
    randSign() * randRange(7.5, 9.5),
    randSign() * randRange(3.2, 4.4),
    randSign() * randRange(1.2, 1.8),
    randSign() * randRange(0.2, 0.5)
  ];

  // Náhodná matice pro získání ortogonální báze Q
  const Rnd = Array.from({ length: N }, () =>
    Array.from({ length: N }, () => Math.random() * 2 - 1)
  );
  const { Q } = qrDecompose(Rnd);

  const D = Array.from({ length: N }, (_, i) =>
    Array.from({ length: N }, (_, j) => (i === j ? eigs[i] : 0))
  );

  return matMul(matMul(Q, D), transpose(Q));
}

function offDiagonalNorm(M) {
  let sum = 0;
  for (let i = 0; i < N; i++) {
    for (let j = 0; j < i; j++) sum += M[i][j] * M[i][j];
  }
  return Math.sqrt(sum);
}

function fitToViewport() {
  const stage = document.getElementById("stage");
  if (!stage) return;
  stage.style.transform = "none";
  const rect = stage.getBoundingClientRect();
  const pad = 12;
  const sx = (window.innerWidth - pad) / rect.width;
  const sy = (window.innerHeight - pad) / rect.height;
  const s = Math.min(1, sx, sy);
  if (!Number.isFinite(s) || s <= 0) return;
  stage.style.transform = s < 0.999 ? `scale(${s})` : "none";
}

function formatVal(x) {
  const v = Math.abs(x) < 0.005 ? 0 : x;
  return v.toFixed(2);
}

function toneFor(i, j, val, isDone) {
  const zero = Math.abs(val) < 0.005;
  if (i === j) return isDone ? "green" : "white";
  if (zero) return "muted";
  if (i > j) return "red";
  return isDone ? "muted" : "dim";
}

function buildGrid() {
  const root = document.getElementById("matrix");
  root.innerHTML = "";
  cells.length = 0;
  for (let i = 0; i < N; i++) {
    const row = document.createElement("div");
    row.className = "row";
    const rowCells = [];
    for (let j = 0; j < N; j++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      row.appendChild(cell);
      rowCells.push(cell);
    }
    root.appendChild(row);
    cells.push(rowCells);
  }
}

function rollCell(cell, text, tone, fromBelow) {
  const current = cell.querySelector(".num.current");
  if (current && current.textContent === text) {
    current.className = `num current tone-${tone}`;
    return;
  }

  const incoming = document.createElement("span");
  incoming.className = `num current tone-${tone}`;
  incoming.textContent = text;
  cell.appendChild(incoming);

  const y = fromBelow ? ROLL_Y : -ROLL_Y;
  incoming.animate(
    [
      { transform: `translateY(${y}px)`, opacity: 0 },
      { transform: "translateY(0px)", opacity: 1 },
    ],
    { duration: ROLL_MS, easing: ROLL_EASE, fill: "forwards" }
  );

  if (current) {
    current.classList.remove("current");
    const leave = current.animate(
      [
        { transform: "translateY(0px)", opacity: 1 },
        { transform: `translateY(${-y}px)`, opacity: 0 },
      ],
      { duration: ROLL_MS, easing: ROLL_EASE, fill: "forwards" }
    );
    leave.onfinish = () => current.remove();
  }
}

function render(isDone = false) {
  for (let i = 0; i < N; i++) {
    for (let j = 0; j < N; j++) {
      const val = A[i][j];
      const text = formatVal(val);
      const tone = toneFor(i, j, val, isDone);
      const cell = cells[i][j];
      const current = cell.querySelector(".num.current");
      const prev = current ? parseFloat(current.textContent) : NaN;
      const next = parseFloat(text);
      const fromBelow = !Number.isFinite(prev) || next >= prev;
      rollCell(cell, text, tone, fromBelow);
    }
  }
  document.getElementById("kSub").textContent = k;
  fitToViewport();
}

function setFlow(active) {
  const pQR = document.getElementById("pQR");
  const pRQ = document.getElementById("pRQ");
  pQR.className = "line" + (active === "qr" ? " active" : "");
  pRQ.className = "line" + (active === "rq" ? " active" : "");
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

async function runForever() {
  while (true) {
    A = generateFastConvergingMatrix();
    k = 0;
    setFlow(null);
    render(false);

    await sleep(1400);

    while (k < MAX_STEPS && offDiagonalNorm(A) > 0.015) {
      setFlow("qr");
      await sleep(320);

      const { Q, R } = qrDecompose(A);
      A = matMul(R, Q);
      k++;

      setFlow("rq");
      render(false);
      await sleep(420);
    }

    setFlow(null);
    render(true);
    await sleep(3800);
  }
}

buildGrid();
window.addEventListener("resize", fitToViewport);
runForever();
</script>
</body>
</html>
