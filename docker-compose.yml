services:
  web:
    build: .
    restart: always
    environment:
      - NODE_ENV=production
      - ADMIN_PASSWORD=Kebab@Husova1320
      - DATABASE_URL=file:/app/prisma/db/prod.db
    networks:
      - dokploy-network  # <-- Connects service to Traefik's network
    volumes:
      - portfolio_db:/app/prisma/db
    command: >
      sh -c "npx prisma db push && node server.js"

volumes:
  portfolio_db:

# Tells compose this network already exists on the host
networks:
  dokploy-network:
    external: true